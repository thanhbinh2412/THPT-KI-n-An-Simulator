name: Build and deploy school simulator

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: school-simulator-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Docker image repositories must be lowercase. Do not derive this from
  # github.repository because the GitHub repository name contains uppercase letters.
  IMAGE_NAME: thanhbinh2412/thpt-kien-an-simulator

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: ${{ github.ref == 'refs/heads/develop' }}
    # Configure the production machine as a repository self-hosted runner.
    # Keep the labels broad so a newly registered Linux runner works immediately.
    runs-on: [self-hosted, linux, x64, thpt-kienan]
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Pull and restart the production container
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.image.outputs.digest }}
          APP_DIR: ${{ vars.SERVER_APP_DIR || '/opt/kien-an-school-simulator' }}
          HOST_PORT: ${{ vars.SERVER_PORT || '3006' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$APP_DIR"
          test -f "$APP_DIR/.env" || { echo "Missing $APP_DIR/.env"; exit 1; }
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE"
          docker rm -f kien-an-school-simulator 2>/dev/null || true
          docker run -d \
            --name kien-an-school-simulator \
            --restart unless-stopped \
            --env-file "$APP_DIR/.env" \
            -p "$HOST_PORT:3000" \
            "$IMAGE"
          for attempt in $(seq 1 12); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' kien-an-school-simulator 2>/dev/null || true)" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          docker logs --tail 100 kien-an-school-simulator
          exit 1
