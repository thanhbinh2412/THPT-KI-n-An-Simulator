<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kiến An — V2 trước và sau</title>
<style>body{margin:0;background:#151916;color:#eee;font:16px system-ui}main{max-width:1300px;margin:24px auto;padding:0 18px}h1{font-size:24px;margin-bottom:8px}p{color:#bfc9c0}nav{display:flex;gap:8px;margin:20px 0}button{border:1px solid #667369;background:#242c26;color:inherit;padding:10px 18px;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:#d5c6a3;color:#151916}figure{position:relative;margin:0;overflow:hidden;background:#222}img{display:block;width:100%;height:auto}#before{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}#divider{position:absolute;top:0;bottom:0;left:50%;width:2px;background:white;pointer-events:none}.tag{position:absolute;top:12px;background:#151916bb;padding:5px 10px;border-radius:6px}.left{left:12px}.right{right:12px}input{width:100%;margin:18px 0;accent-color:#d5c6a3}small{color:#a9b5aa}</style>
<main><h1>Kiến An — hoàn thiện Semi-realistic trên V2</h1><p>Kéo thanh để so sánh cùng góc máy. Bên trái: trước chỉnh. Bên phải: sau chỉnh.</p><nav aria-label="Góc nhìn"><button data-shot="courtyard" aria-pressed="true">Góc sân</button><button data-shot="overview" aria-pressed="false">Toàn cảnh</button><button data-shot="eye_level" aria-pressed="false">Tầm mắt</button></nav><figure><img id="after" src="after/courtyard.png" alt="Sân trường sau khi chỉnh vật liệu, cây và ánh sáng"><img id="before" src="before/courtyard.png" alt="Sân trường trước khi chỉnh"><div id="divider"></div><span class="tag left">Trước</span><span class="tag right">Sau</span></figure><label for="slider">Vị trí so sánh</label><input id="slider" type="range" min="0" max="100" value="50"><small>Giữ bố cục đã duyệt. Chỉnh vật liệu PBR, gạch sân, lá cây, bo cạnh và ánh sáng. Vật liệu và texture đã nhúng trong GLB; ánh sáng trời thuộc scene Blender.</small></main>
<script>const before=document.querySelector('#before'),after=document.querySelector('#after'),divider=document.querySelector('#divider'),slider=document.querySelector('#slider');slider.addEventListener('input',()=>{before.style.clipPath=`inset(0 ${100-slider.value}% 0 0)`;divider.style.left=slider.value+'%'});document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{before.src='before/'+button.dataset.shot+'.png';after.src='after/'+button.dataset.shot+'.png';document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===button?'true':'false'))}));</script></html>
